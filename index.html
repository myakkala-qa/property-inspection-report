<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%2320293A'/%3E%3Crect x='30' y='18' width='60' height='84' fill='%23F7F6F2'/%3E%3Crect x='42' y='10' width='36' height='16' rx='2' fill='%232E4B3F'/%3E%3Cline x1='40' y1='40' x2='80' y2='40' stroke='%2320293A' stroke-width='4'/%3E%3Cline x1='40' y1='54' x2='80' y2='54' stroke='%2320293A' stroke-width='4'/%3E%3Cline x1='40' y1='68' x2='68' y2='68' stroke='%2320293A' stroke-width='4'/%3E%3Ccircle cx='40' cy='84' r='6' fill='%233E7A52'/%3E%3C/svg%3E">
<title>Property Inspection Tracker</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#F7F6F2;
    --ink:#20293A;
    --ink-soft:#5B6472;
    --line:#D8D5CB;
    --line-strong:#B7B2A2;
    --accent:#2E4B3F;
    --good:#3E7A52;
    --good-bg:#E7F1E9;
    --fair:#B4791E;
    --fair-bg:#FBF0DC;
    --poor:#B4432B;
    --poor-bg:#FAE6E1;
    --na-bg:#EDECE7;
  }
  :root{ color-scheme: light; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    padding:0 0 4rem;
  }
  .wrap{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}

  header{
    border-bottom:2px solid var(--ink);
    padding-bottom:1.25rem;
    margin-bottom:1.5rem;
  }
  header h1{
    font-size:1.6rem;
    font-weight:600;
    margin:0 0 .9rem;
    letter-spacing:-0.01em;
  }
  .meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:.75rem 1.25rem;
  }
  .meta-field label{
    display:block;
    font-size:.72rem;
    color:var(--ink-soft);
    margin-bottom:.25rem;
    font-family:'IBM Plex Mono',monospace;
  }
  .meta-field input,
  .meta-field select{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line-strong);
    background:transparent;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:.95rem;
    padding:.3rem 0;
    color:var(--ink);
  }
  .meta-field select{cursor:pointer;}
  .meta-field input:focus,
  .meta-field select:focus{outline:none;border-bottom-color:var(--accent);}

  .summary-bar{
    display:flex;
    gap:1.5rem;
    flex-wrap:wrap;
    margin:1.25rem 0 1.75rem;
    padding:.9rem 1.1rem;
    background:#fff;
    border:1px solid var(--line);
  }
  .summary-item{font-size:.85rem;color:var(--ink-soft);}
  .summary-item b{color:var(--ink);font-weight:600;}
  .summary-item.flag-fair b{color:var(--fair);}
  .summary-item.flag-poor b{color:var(--poor);}

  .area{
    margin-bottom:1.5rem;
    border:1px solid var(--line);
    background:#fff;
  }
  .area-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:.8rem 1rem;
    background:var(--ink);
    color:var(--paper);
    gap:.6rem;
  }
  .area-head-left{display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;}
  .drag-handle{
    cursor:grab;
    color:rgba(247,246,242,.5);
    font-family:'IBM Plex Mono',monospace;
    font-size:.9rem;
    user-select:none;
    padding:.1rem .2rem;
    flex-shrink:0;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-card .drag-handle{
    color:var(--ink-soft);
    align-self:center;
  }
  .area.drag-over{
    outline:2px dashed var(--accent);
    outline-offset:-2px;
  }
  .area.dragging{opacity:.4;}
  .area-head input{
    background:transparent;
    border:none;
    color:var(--paper);
    font-size:1.02rem;
    font-weight:600;
    font-family:'IBM Plex Sans',sans-serif;
    width:60%;
  }
  .area-head input:focus{outline:none;border-bottom:1px solid var(--paper);}
  .area-head .area-actions{display:flex;gap:.6rem;align-items:center;}
  .area-head button{
    background:none;border:1px solid rgba(247,246,242,.4);color:var(--paper);
    font-size:.72rem;padding:.3rem .55rem;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .area-head button:hover{background:rgba(247,246,242,.12);}

  .items{padding:.4rem 1rem 1rem;}
  .item-card{
    padding:.8rem 0;
    border-bottom:1px solid var(--line);
  }
  .item-card:last-child{border-bottom:none;}
  .item-card.dragging{opacity:.4;}
  .item-card.drag-over{border-top:2px solid var(--accent);}
  .item-top{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin-bottom:.5rem;
  }
  .item-top .drag-handle{flex-shrink:0;}
  .item-top input.item-name{
    flex:1;
    min-width:0;
    border:none;background:transparent;font-size:.92rem;font-weight:500;
    padding:.35rem 0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  }
  .item-top input.item-name:focus{outline:none;}
  .item-top select{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    padding:.35rem .4rem;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    flex-shrink:0;
  }
  .item-top select.cond-good{background:var(--good-bg);color:var(--good);border-color:var(--good);}
  .item-top select.cond-fair{background:var(--fair-bg);color:var(--fair);border-color:var(--fair);}
  .item-top select.cond-poor{background:var(--poor-bg);color:var(--poor);border-color:var(--poor);}
  .item-top select.cond-na{background:var(--na-bg);color:var(--ink-soft);}
  .item-top .del-item{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    font-size:.95rem;padding:.35rem;flex-shrink:0;
  }
  .item-top .del-item:hover{color:var(--poor);}
  .item-card textarea{
    width:100%;
    resize:vertical;
    min-height:2.1rem;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:.85rem;
    border:1px solid var(--line);
    padding:.35rem .5rem;
    color:var(--ink);
    margin-bottom:.5rem;
  }
  .item-card textarea:focus{outline:none;border-color:var(--accent);}

  .item-photos{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
  .photo-thumb{
    width:52px;height:52px;
    border:1px solid var(--line-strong);
    background-size:cover;background-position:center;
    cursor:pointer;padding:0;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .add-photo-btn{
    width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;
    border:1px dashed var(--line-strong);
    font-size:1rem;
    cursor:pointer;
    color:var(--ink-soft);
    background:var(--paper);
  }
  .add-photo-btn:hover{border-color:var(--accent);color:var(--accent);}
  .add-photo-btn input{display:none;}

  .add-item-row{
    display:flex;gap:.6rem;align-items:center;padding-top:.6rem;flex-wrap:wrap;
  }
  .add-item-row input{
    flex:1;min-width:140px;
    border:1px dashed var(--line-strong);
    padding:.4rem .6rem;
    font-size:.85rem;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .add-item-row input:focus{outline:none;border-color:var(--accent);}
  .add-item-row select{
    border:1px solid var(--line-strong);
    background:#fff;
    padding:.4rem .5rem;
    font-size:.85rem;
    font-family:'IBM Plex Sans',sans-serif;
    color:var(--ink);
    min-width:170px;
  }
  .add-item-row select:focus{outline:none;border-color:var(--accent);}
  .add-item-row button.add-btn{
    border:1px solid var(--accent);color:var(--accent);background:#fff;
    padding:.4rem .8rem;font-size:.8rem;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .add-item-row button.add-btn:hover{background:var(--accent);color:#fff;}

  .quick-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;}
  .chip{
    font-size:.74rem;
    font-family:'IBM Plex Mono',monospace;
    border:1px solid var(--line-strong);
    background:var(--paper);
    padding:.25rem .55rem;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}

  .bottom-actions{
    display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.75rem;
  }
  .bottom-actions button{
    font-family:'IBM Plex Mono',monospace;
    font-size:.82rem;
    padding:.6rem 1.1rem;
    cursor:pointer;
    border:1px solid var(--ink);
    background:#fff;
    color:var(--ink);
  }
  .bottom-actions button.primary{background:var(--ink);color:var(--paper);}
  .bottom-actions button:hover{opacity:.85;}
  .signin-icon{
    font-weight:700;font-size:1rem;margin-left:-.4rem;
    display:inline-flex;align-items:center;
  }
  .signin-icon.ok{color:var(--good);}
  .signin-icon.fail{color:var(--poor);}

  .save-status{
    font-size:.72rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;
    margin-top:.5rem;
  }

  @media (max-width:640px){
    .item-top{flex-wrap:wrap;}
    .item-top input.item-name{flex-basis:100%;order:1;}
  }

  @media print{
    body{background:#fff;}
    .add-item-row,.area-head button,.bottom-actions,.save-status,.add-photo-btn,.header-actions,.modal-overlay{display:none !important;}
    .area{break-inside:avoid;}
    .area-head{background:#eee !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .area-head input{color:#000 !important;}
    .photo-thumb{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  .header-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.5rem;}
  .header-actions{display:flex;gap:.6rem;}
  .linklike{
    background:none;border:1px solid var(--line-strong);color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:.75rem;
    padding:.35rem .65rem;cursor:pointer;
  }
  .linklike:hover{border-color:var(--accent);color:var(--accent);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(32,41,58,.55);
    display:flex;align-items:center;justify-content:center;
    padding:1.25rem;z-index:100;
  }
  .modal-overlay[hidden]{display:none;}
  .modal{
    background:#fff;max-width:520px;width:100%;max-height:80vh;
    overflow-y:auto;border:1px solid var(--line);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:.9rem 1rem;background:var(--ink);color:var(--paper);
    font-weight:600;position:sticky;top:0;
  }
  .modal-head button{background:none;border:none;color:var(--paper);font-size:1.1rem;cursor:pointer;}
  #drafts-list{padding:.5rem;}
  .empty-note{padding:1rem;color:var(--ink-soft);font-size:.88rem;}
  .draft-row{
    display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    padding:.75rem;border-bottom:1px solid var(--line);
  }
  .draft-row:last-child{border-bottom:none;}
  .draft-row.draft-current{background:var(--good-bg);}
  .draft-title{font-weight:600;font-size:.9rem;}
  .draft-meta{font-size:.72rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:.15rem;}
  .draft-actions{display:flex;gap:.4rem;flex-shrink:0;}
  .draft-actions button{
    font-family:'IBM Plex Mono',monospace;font-size:.72rem;
    padding:.35rem .6rem;border:1px solid var(--line-strong);background:#fff;cursor:pointer;
  }
  .draft-resume:hover{border-color:var(--accent);color:var(--accent);}
  .draft-delete:hover{border-color:var(--poor);color:var(--poor);}

  .lightbox-inner{max-width:90vw;max-height:85vh;display:flex;flex-direction:column;gap:.75rem;align-items:center;}
  .lightbox-inner img{max-width:90vw;max-height:70vh;object-fit:contain;background:#000;}
  .lightbox-actions{display:flex;gap:.6rem;}
  .lightbox-actions button{
    font-family:'IBM Plex Mono',monospace;font-size:.8rem;padding:.5rem 1rem;cursor:pointer;
    border:1px solid #fff;background:transparent;color:#fff;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-top">
      <h1>Property inspection</h1>
      <div class="header-actions">
        <button class="linklike" id="drafts-btn">My inspections</button>
        <button class="linklike" id="new-btn">+ New</button>
      </div>
    </div>
    <div class="meta-grid">
      <div class="meta-field"><label>Property address</label><input id="f-address" placeholder="12 Example St, Auckland"></div>
      <div class="meta-field"><label>Inspection date</label><input id="f-date" type="date"></div>
      <div class="meta-field"><label>Inspector</label><input id="f-inspector" placeholder="Name"></div>
      <div class="meta-field"><label>Inspection type</label>
        <select id="f-type">
          <option value="">Select…</option>
          <option value="Routine">Routine</option>
          <option value="Entry">Entry</option>
          <option value="Exit">Exit</option>
        </select>
      </div>
    </div>
  </header>

  <div class="summary-bar" id="summary-bar"></div>

  <div id="areas"></div>

  <div class="add-item-row" id="new-area-row" style="border:1px dashed var(--line-strong);padding:.8rem;margin-bottom:1.5rem;">
    <input id="new-area-name" placeholder="Room name, e.g. Study">
    <select id="new-area-template"></select>
    <button class="add-btn" id="add-area-btn">+ Add area</button>
  </div>

  <div class="add-item-row" id="client-id-row" style="border:1px dashed var(--line-strong);padding:.8rem;margin-bottom:1rem;">
    <input id="client-id-input" placeholder="Paste your Google Client ID (ends in .apps.googleusercontent.com)">
    <button class="add-btn" id="client-id-save">Save</button>
  </div>

  <div class="bottom-actions">
    <button class="primary" id="export-btn">Download report</button>
    <button id="print-btn">Print / save as PDF</button>
    <button id="drive-signin-btn">Sign in with Google</button><span id="drive-signin-icon" class="signin-icon"></span>
    <button id="drive-upload-btn" style="display:none;">Save to Drive</button>
    <button id="reset-btn">Delete this inspection</button>
  </div>
  <div class="save-status" id="save-status">Autosaves as you go</div>
  <div class="save-status" id="drive-status"></div>
  <div class="save-status"><button class="linklike" id="client-id-change" style="display:none;">Change Google Client ID</button></div>

</div>

<div class="modal-overlay" id="drafts-modal" hidden>
  <div class="modal">
    <div class="modal-head"><span>My inspections</span><button id="drafts-close">✕</button></div>
    <div id="drafts-list"></div>
  </div>
</div>

<div class="modal-overlay" id="lightbox" hidden>
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt="Item photo">
    <div class="lightbox-actions">
      <button id="lightbox-delete">Delete photo</button>
      <button id="lightbox-close">Close</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'inspection:current';
const CONDITIONS = ['Good','Fair','Poor','N/A'];
const INDEX_KEY = 'inspection:index';
const CURRENT_KEY = 'inspection:currentId';
function draftKey(id){ return 'inspection:draft:' + id; }

// ── Google Drive integration ──
// To enable "Save to Drive": in Google Cloud Console, create an OAuth Client ID
// (Application type: Web application; Authorized JavaScript origin = this page's
// https:// URL), then paste the Client ID below and re-upload this file.
// Stored in the browser's local storage (key: inspection:googleClientId), not in this
// file, so re-uploading an updated version of this file never wipes it out.
const CLIENT_ID_KEY = 'inspection:googleClientId';
let GOOGLE_CLIENT_ID = localStorage.getItem(CLIENT_ID_KEY) || '';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
let driveTokenClient = null;
let driveAccessToken = null;

// Standalone storage adapter — uses the browser's local storage directly,
// so this works fully offline once added to the Home Screen (no Claude needed).
const localDB = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  }
};

const DEFAULT_AREAS = [
  { name:'Kitchen', items:['Walls','Ceiling','Flooring','Rangehood','Gas cooktop / oven','Cabinetry','Sink & taps','Windows'] },
  { name:'Bathroom', items:['Walls','Ceiling','Flooring','Vanity','Mirror','Shower/bath','Toilet','Taps & plumbing','Extractor fan'] },
  { name:'Living areas', items:['Walls','Ceiling','Flooring','Doors','Windows','Light fittings','Power points'] },
  { name:'Bedrooms', items:['Walls','Ceiling','Flooring','Doors','Windows','Wardrobe','Light fittings'] },
];

const ROOM_TEMPLATES = {
  'Kitchen': ['Walls','Ceiling','Flooring','Rangehood','Gas cooktop / oven','Cabinetry','Sink & taps','Windows','Light fittings','Power points'],
  'Bathroom': ['Walls','Ceiling','Flooring','Vanity','Mirror','Shower/bath','Toilet','Taps & plumbing','Extractor fan','Light fittings'],
  'Bedroom': ['Walls','Ceiling','Flooring','Doors','Windows','Wardrobe','Light fittings','Power points','Curtains/blinds'],
  'Living area': ['Walls','Ceiling','Flooring','Doors','Windows','Light fittings','Power points','Curtains/blinds'],
  'Laundry': ['Walls','Ceiling','Flooring','Sink & taps','Cabinetry','Windows','Light fittings','Power points','Extractor fan'],
  'Garage': ['Walls','Ceiling','Flooring','Garage door','Windows','Light fittings','Power points'],
  'Outdoor / exterior': ['Exterior walls','Roof','Guttering','Fencing','Decking/paving','Garden beds','Letterbox','Outdoor lighting'],
  'Hallway / entry': ['Walls','Ceiling','Flooring','Front door','Light fittings','Power points'],
  'Blank (no preset items)': []
};

const COMMON_ITEMS = ['Walls','Ceiling','Flooring','Doors','Windows','Light fittings','Power points','Skirting boards','Curtains/blinds','Smoke alarm'];

let state = null;
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,9); }

function freshState(id){
  return {
    id,
    address:'', date:'', inspector:'', type:'',
    areas: DEFAULT_AREAS.map(a => ({
      id: uid(),
      name: a.name,
      items: a.items.map(name => ({ id: uid(), name, condition:'', notes:'', photos:[] }))
    }))
  };
}

async function getIndex(){
  try{
    const r = await localDB.get(INDEX_KEY);
    return r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function setIndex(idx){
  await localDB.set(INDEX_KEY, JSON.stringify(idx));
}
async function upsertIndexEntry(){
  const idx = await getIndex();
  const i = idx.findIndex(d=>d.id===state.id);
  const entry = { id: state.id, address: state.address, date: state.date, type: state.type, updatedAt: Date.now() };
  if(i>=0) idx[i] = entry; else idx.push(entry);
  await setIndex(idx);
}

async function startFreshDraft(){
  state = freshState(uid());
  await localDB.set(CURRENT_KEY, state.id);
  await localDB.set(draftKey(state.id), JSON.stringify(state));
  await upsertIndexEntry();
}

async function load(){
  try{
    const curRes = await localDB.get(CURRENT_KEY);
    const currentId = curRes ? curRes.value : null;
    if(currentId){
      const draftRes = await localDB.get(draftKey(currentId));
      if(draftRes && draftRes.value) state = JSON.parse(draftRes.value);
    }
    if(!state) await startFreshDraft();
  }catch(e){
    await startFreshDraft();
  }
  render();
}

function scheduleSave(){
  document.getElementById('save-status').textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await localDB.set(draftKey(state.id), JSON.stringify(state));
      await upsertIndexEntry();
      document.getElementById('save-status').textContent = 'Saved ' + new Date().toLocaleTimeString();
    }catch(e){
      document.getElementById('save-status').textContent = 'Could not save — your changes stay in this session';
    }
  }, 500);
}

function condClass(c){
  if(c==='Good') return 'cond-good';
  if(c==='Fair') return 'cond-fair';
  if(c==='Poor') return 'cond-poor';
  if(c==='N/A') return 'cond-na';
  return '';
}

function renderSummary(){
  let total=0, good=0, fair=0, poor=0, unrated=0;
  state.areas.forEach(a=>a.items.forEach(it=>{
    total++;
    if(it.condition==='Good') good++;
    else if(it.condition==='Fair') fair++;
    else if(it.condition==='Poor') poor++;
    else if(it.condition==='') unrated++;
  }));
  const bar = document.getElementById('summary-bar');
  bar.innerHTML = `
    <div class="summary-item"><b>${total}</b> items tracked</div>
    <div class="summary-item"><b>${good}</b> good</div>
    <div class="summary-item flag-fair"><b>${fair}</b> fair</div>
    <div class="summary-item flag-poor"><b>${poor}</b> poor</div>
    <div class="summary-item"><b>${unrated}</b> not yet rated</div>
  `;
}

function render(){
  document.getElementById('f-address').value = state.address;
  document.getElementById('f-date').value = state.date;
  document.getElementById('f-inspector').value = state.inspector;
  document.getElementById('f-type').value = state.type;

  const areasEl = document.getElementById('areas');
  areasEl.innerHTML = '';

  state.areas.forEach(area=>{
    const areaDiv = document.createElement('div');
    areaDiv.className = 'area';

    areaDiv.dataset.areaId = area.id;

    const head = document.createElement('div');
    head.className = 'area-head';
    head.innerHTML = `
      <div class="area-head-left">
        <span class="drag-handle" draggable="true" title="Drag to reorder">⠿</span>
        <input class="area-name-input" value="${escapeAttr(area.name)}">
      </div>
      <div class="area-actions">
        <button class="del-area-btn" title="Remove this area">Remove area</button>
      </div>
    `;
    head.querySelector('.area-name-input').addEventListener('input', e=>{
      area.name = e.target.value; scheduleSave();
    });
    head.querySelector('.del-area-btn').addEventListener('click', ()=>{
      if(confirm(`Remove "${area.name}" and all its items?`)){
        state.areas = state.areas.filter(a=>a.id!==area.id);
        scheduleSave(); render();
      }
    });
    areaDiv.appendChild(head);

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';

    area.items.forEach(item=>{
      if(!item.photos) item.photos = [];
      const row = document.createElement('div');
      row.className = 'item-card';
      row.dataset.itemId = item.id;
      row.innerHTML = `
        <div class="item-top">
          <span class="drag-handle" draggable="true" title="Drag to reorder">⠿</span>
          <input class="item-name" value="${escapeAttr(item.name)}" placeholder="Item name">
          <select class="${condClass(item.condition)}">
            <option value=""${item.condition===''?' selected':''}>Rate…</option>
            ${CONDITIONS.map(c=>`<option value="${c}"${item.condition===c?' selected':''}>${c}</option>`).join('')}
          </select>
          <button class="del-item" title="Remove item"><i>✕</i></button>
        </div>
        <textarea placeholder="Notes — damage, wear, action needed">${escapeHtml(item.notes)}</textarea>
        <div class="item-photos">
          ${item.photos.map((src,idx)=>`<button type="button" class="photo-thumb" data-idx="${idx}" style="background-image:url('${src}')" title="View photo"></button>`).join('')}
          <label class="add-photo-btn" title="Add a photo">
            📷
            <input type="file" accept="image/*" capture="environment" class="photo-input">
          </label>
        </div>
      `;
      row.querySelector('.item-name').addEventListener('input', e=>{
        item.name = e.target.value; scheduleSave();
      });
      const sel = row.querySelector('select');
      sel.addEventListener('change', e=>{
        item.condition = e.target.value;
        sel.className = condClass(item.condition);
        scheduleSave(); renderSummary();
      });
      row.querySelector('textarea').addEventListener('input', e=>{
        item.notes = e.target.value; scheduleSave();
      });
      row.querySelector('.del-item').addEventListener('click', ()=>{
        area.items = area.items.filter(i=>i.id!==item.id);
        scheduleSave(); render();
      });
      row.querySelectorAll('.photo-thumb').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          openLightbox(item, parseInt(btn.dataset.idx,10));
        });
      });
      const photoInput = row.querySelector('.photo-input');
      photoInput.addEventListener('change', async e=>{
        const file = e.target.files[0];
        if(!file) return;
        try{
          const dataUrl = await compressImage(file);
          item.photos.push(dataUrl);
          scheduleSave(); render();
        }catch(err){
          alert('Could not process that photo. Please try again.');
        }
      });
      itemsDiv.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-item-row';
    addRow.innerHTML = `<input placeholder="Add item, e.g. Wardrobe door"><button class="add-btn">+ Add</button>`;
    const addInput = addRow.querySelector('input');
    const addBtn = addRow.querySelector('.add-btn');
    const doAdd = (nameOverride)=>{
      const v = (nameOverride !== undefined ? nameOverride : addInput.value).trim();
      if(!v) return;
      area.items.push({ id: uid(), name: v, condition:'', notes:'', photos:[] });
      addInput.value='';
      scheduleSave(); render();
    };
    addBtn.addEventListener('click', ()=>doAdd());
    addInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
    itemsDiv.appendChild(addRow);

    const existingNames = new Set(area.items.map(i=>i.name.trim().toLowerCase()));
    const suggestions = COMMON_ITEMS.filter(n=>!existingNames.has(n.toLowerCase())).slice(0,8);
    if(suggestions.length){
      const chipsDiv = document.createElement('div');
      chipsDiv.className = 'quick-chips';
      suggestions.forEach(name=>{
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = '+ ' + name;
        chip.addEventListener('click', ()=>doAdd(name));
        chipsDiv.appendChild(chip);
      });
      itemsDiv.appendChild(chipsDiv);
    }

    areaDiv.appendChild(itemsDiv);
    areasEl.appendChild(areaDiv);
  });

  renderSummary();
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

document.getElementById('f-address').addEventListener('input', e=>{ state.address=e.target.value; scheduleSave(); });
document.getElementById('f-date').addEventListener('input', e=>{ state.date=e.target.value; scheduleSave(); });
document.getElementById('f-inspector').addEventListener('input', e=>{ state.inspector=e.target.value; scheduleSave(); });
document.getElementById('f-type').addEventListener('change', e=>{ state.type=e.target.value; scheduleSave(); });

// --- Drag and drop reordering (areas + items within an area) ---
const areasEl = document.getElementById('areas');
let dragKind = null;   // 'area' | 'item'
let dragAreaId = null;
let dragItemId = null;

areasEl.addEventListener('dragstart', e=>{
  const handle = e.target.closest('.drag-handle');
  if(!handle) return;
  const itemRow = handle.closest('.item-card');
  const areaBlock = handle.closest('.area');
  if(itemRow){
    dragKind = 'item';
    dragAreaId = areaBlock.dataset.areaId;
    dragItemId = itemRow.dataset.itemId;
    itemRow.classList.add('dragging');
  }else if(areaBlock){
    dragKind = 'area';
    dragAreaId = areaBlock.dataset.areaId;
    areaBlock.classList.add('dragging');
  }
  e.dataTransfer.effectAllowed = 'move';
});

areasEl.addEventListener('dragend', e=>{
  areasEl.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
  areasEl.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragKind = null; dragAreaId = null; dragItemId = null;
});

areasEl.addEventListener('dragover', e=>{
  if(!dragKind) return;
  e.preventDefault();
  if(dragKind === 'area'){
    const overArea = e.target.closest('.area');
    areasEl.querySelectorAll('.area.drag-over').forEach(el=>el.classList.remove('drag-over'));
    if(overArea) overArea.classList.add('drag-over');
  }else if(dragKind === 'item'){
    const overRow = e.target.closest('.item-card');
    const overAreaBlock = e.target.closest('.area');
    areasEl.querySelectorAll('.item-card.drag-over').forEach(el=>el.classList.remove('drag-over'));
    if(overRow && overAreaBlock && overAreaBlock.dataset.areaId === dragAreaId){
      overRow.classList.add('drag-over');
    }
  }
});

areasEl.addEventListener('drop', e=>{
  if(!dragKind) return;
  e.preventDefault();

  if(dragKind === 'area'){
    const overArea = e.target.closest('.area');
    if(overArea && overArea.dataset.areaId !== dragAreaId){
      const fromIdx = state.areas.findIndex(a=>a.id===dragAreaId);
      const toIdx = state.areas.findIndex(a=>a.id===overArea.dataset.areaId);
      const [moved] = state.areas.splice(fromIdx,1);
      state.areas.splice(toIdx,0,moved);
      scheduleSave(); render();
    }
  }else if(dragKind === 'item'){
    const overRow = e.target.closest('.item-card');
    const overAreaBlock = e.target.closest('.area');
    if(overRow && overAreaBlock && overAreaBlock.dataset.areaId === dragAreaId){
      const area = state.areas.find(a=>a.id===dragAreaId);
      const fromIdx = area.items.findIndex(i=>i.id===dragItemId);
      const toIdx = area.items.findIndex(i=>i.id===overRow.dataset.itemId);
      if(fromIdx !== -1 && toIdx !== -1 && fromIdx !== toIdx){
        const [moved] = area.items.splice(fromIdx,1);
        area.items.splice(toIdx,0,moved);
        scheduleSave(); render();
      }
    }
  }
});

function populateTemplateSelect(){
  const sel = document.getElementById('new-area-template');
  sel.innerHTML = Object.keys(ROOM_TEMPLATES).map(name=>`<option value="${escapeAttr(name)}">${name}</option>`).join('');

function buildReportText(){
  let lines = [];
  lines.push(`PROPERTY INSPECTION REPORT`);
  lines.push(`Address: ${state.address||'—'}`);
  lines.push(`Date: ${state.date||'—'}`);
  lines.push(`Inspector: ${state.inspector||'—'}`);
  lines.push(`Type: ${state.type||'—'}`);
  lines.push('');
  state.areas.forEach(area=>{
    lines.push(`## ${area.name}`);
    area.items.forEach(it=>{
      const photoNote = it.photos && it.photos.length ? ` (${it.photos.length} photo${it.photos.length>1?'s':''} attached — see printed/PDF copy)` : '';
      lines.push(`- ${it.name}: ${it.condition||'Not rated'}${it.notes ? ' — '+it.notes : ''}${photoNote}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

function reportFilename(ext){
  return `inspection-${(state.address||'report').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.${ext||'txt'}`;
}

  const input = document.getElementById('client-id-input');
  const v = input.value.trim();

  if(!v.endsWith('.apps.googleusercontent.com')){

  }

  GOOGLE_CLIENT_ID = v;
  driveTokenClient = null; // force re-init with the new ID
  input.value = '';
  refreshClientIdUI();

// --- New inspection / drafts (multiple saved inspections) ---
document.getElementById('new-btn').addEventListener('click', async ()=>{
  if(!confirm('Start a new inspection? Your current one stays saved and can be resumed from "My inspections".')) return;
  await startFreshDraft();
  render();
});

document.getElementById('reset-btn').addEventListener('click', ()=> deleteDraft(state.id));

async function deleteDraft(id){
  if(!confirm('Delete this inspection? This cannot be undone.')) return;
  try{ localStorage.removeItem(draftKey(id)); }catch(e){}
  let idx = await getIndex();
  idx = idx.filter(d=>d.id!==id);
  await setIndex(idx);
  if(id === state.id){
    if(idx.length){
      await resumeDraft(idx[0].id);
    }else{
      await startFreshDraft();
      render();
    }
  }
  if(!document.getElementById('drafts-modal').hidden) openDraftsModal();
}

async function resumeDraft(id){
  if(id === state.id){ document.getElementById('drafts-modal').hidden = true; return; }
  try{
    const res = await localDB.get(draftKey(id));
    if(res && res.value){
      state = JSON.parse(res.value);
      await localDB.set(CURRENT_KEY, state.id);
      render();
    }
  }catch(e){}
  document.getElementById('drafts-modal').hidden = true;
}

async function openDraftsModal(){
  const idx = await getIndex();
  idx.sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  const list = document.getElementById('drafts-list');
  if(!idx.length){
    list.innerHTML = '<p class="empty-note">No saved inspections yet.</p>';
  }else{
    list.innerHTML = idx.map(d=>`
      <div class="draft-row${d.id===state.id?' draft-current':''}" data-id="${d.id}">
        <div class="draft-info">
          <div class="draft-title">${escapeHtml(d.address||'Untitled property')}</div>
          <div class="draft-meta">${escapeHtml(d.type||'No type set')}${d.date?' · '+escapeHtml(d.date):''} · updated ${new Date(d.updatedAt||0).toLocaleString()}</div>
        </div>
        <div class="draft-actions">
          <button class="draft-resume">${d.id===state.id?'Current':'Resume'}</button>
          <button class="draft-delete">Delete</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.draft-row').forEach(rowEl=>{
      const id = rowEl.dataset.id;
      rowEl.querySelector('.draft-resume').addEventListener('click', ()=>resumeDraft(id));
      rowEl.querySelector('.draft-delete').addEventListener('click', ()=>deleteDraft(id));
    });
  }
  document.getElementById('drafts-modal').hidden = false;
}
document.getElementById('drafts-btn').addEventListener('click', openDraftsModal);
document.getElementById('drafts-close').addEventListener('click', ()=>{ document.getElementById('drafts-modal').hidden = true; });
document.getElementById('drafts-modal').addEventListener('click', e=>{
  if(e.target.id === 'drafts-modal') document.getElementById('drafts-modal').hidden = true;
});

// --- Photo capture, compression, and lightbox ---
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not load image'));
      img.onload = ()=>{
        const maxDim = 1000;
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let lightboxItem = null, lightboxIdx = null;
function openLightbox(item, idx){
  lightboxItem = item; lightboxIdx = idx;
  document.getElementById('lightbox-img').src = item.photos[idx];

document.getElementById('export-btn').addEventListener('click', ()=>{
  const blob = new Blob([buildReportText()], {type:'text/plain'});
  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = reportFilename('txt');
  a.click();
  URL.revokeObjectURL(url);
});

// --- Google Drive sign-in and upload ---
function setDriveStatus(msg, isError){
  const el = document.getElementById('drive-status');
  el.textContent = msg;
  el.style.color = isError ? 'var(--poor)' : 'var(--ink-soft)';
}

function setSigninIcon(state){
  const el = document.getElementById('drive-signin-icon');
  if(state === 'ok'){ el.textContent = '✓'; el.className = 'signin-icon ok'; }
  else if(state === 'fail'){ el.textContent = '✗'; el.className = 'signin-icon fail'; }
  else{ el.textContent = ''; el.className = 'signin-icon'; }
}

function initDriveAuth(){
  if(!GOOGLE_CLIENT_ID) return;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){
        setDriveStatus('Google sign-in failed: ' + resp.error, true);
        setSigninIcon('fail');
        return;
      }
      driveAccessToken = resp.access_token;
      setSigninIcon('ok');
      setDriveStatus('Signed in — checking account…', false);
      document.getElementById('drive-signin-btn').textContent = 'Signed in to Google';
      document.getElementById('drive-upload-btn').style.display = '';
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { 'Authorization': 'Bearer ' + driveAccessToken }
      })
        .then(async r => {
          if(r.ok) return r.json();
          const t = await r.text().catch(()=> '');
          throw new Error('userinfo ' + r.status + (t ? ': ' + t.slice(0,150) : ''));
        })
        .then(info => {
          if(info && info.email){
            setDriveStatus('Signed in as ' + info.email, false);
          }else{
            setDriveStatus('Signed in to Google, but no email returned. Ready to save to Drive.', false);
          }
        })
        .catch(err => setDriveStatus('Signed in to Google. (Could not confirm email: ' + err.message + ')', false));
    }
  });
}

document.getElementById('drive-signin-btn').addEventListener('click', ()=>{
  if(!GOOGLE_CLIENT_ID){
    setDriveStatus('Add your Google Client ID above first, then tap Save.', true);
    setSigninIcon('fail');
    return;
  }
  setSigninIcon(null);
  if(!driveTokenClient) initDriveAuth();
  if(driveTokenClient) driveTokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
});

document.getElementById('drive-upload-btn').addEventListener('click', async ()=>{
  if(!driveAccessToken){ setDriveStatus('Please sign in first.', true); return; }
  setDriveStatus('Uploading to Drive…', false);
  try{
    await uploadToDrive(reportFilename('txt'), buildReportText(), 'text/plain');
    setDriveStatus('Saved to Google Drive.', false);
  }catch(err){
    setDriveStatus('Upload failed: ' + (err.message || 'unknown error'), true);
  }
});

async function uploadToDrive(filename, content, mimeType){
  const metadata = { name: filename, mimeType };
  const boundary = 'inspboundary' + Date.now();
  const body =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: ${mimeType}\r\n\r\n` +
    content + `\r\n` +
    `--${boundary}--`;

  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers:{
      'Authorization': 'Bearer ' + driveAccessToken,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('Drive API error ' + res.status + (t ? ': ' + t.slice(0,200) : ''));
  }
  return res.json();
}

window.addEventListener('load', ()=>{ setTimeout(initDriveAuth, 300); });

load();
